[workspace]
resolver = "3"
members = ["crates/games-shell", "crates/rubevy-egui", "factory", "garden", "sabibots"]

# One Bevy for the whole repository: a binary can only have one, and keeping the version in one
# place is what makes bumping it a single edit for every game here.
[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
  "bevy_asset", "bevy_log", "bevy_window", "bevy_winit", "bevy_core_pipeline",
  "bevy_render", "bevy_sprite", "bevy_text", "bevy_ui", "bevy_ui_render",
  "default_font", "png",
  # Factory's floor (F0): `bevy::sprite_render::TilemapChunk`, a chunk of tiles in one draw
  # call, out of an array texture. It was already on — `bevy_ui_render` above turns it on —
  # and naming it changes no build; it is here so that the third game's floor does not depend
  # on a feature nothing in the list mentions.
  "bevy_sprite_render",
  # 3D, for the garden: meshes with a StandardMaterial, lights and shadows. The tonemapper a
  # Camera3d asks for by default (TonyMcMapface) reads its curve from a KTX2 lookup table, which
  # `tonemapping_luts` embeds; `zstd_rust` is the decompressor for it (the pure-Rust one, so the
  # browser build has it too). sabibots is 2D and uses none of this — it only pays the build time.
  "bevy_pbr", "tonemapping_luts", "zstd_rust",
  # the garden's models (G0a): CC0 glTF from Kenney, loaded as scenes, with the node animations
  # (idle / walk / eat) the two animals carry. `bevy_gltf` brings the loader, `bevy_scene` what a
  # loaded glTF becomes, `bevy_animation` the clips and the `AnimationPlayer` that runs them.
  # `gltf_animation` is the one that makes the loader read the clips at all: `bevy_animation`
  # alone gives you `AnimationPlayer` and an empty `.glb#Animation0`.
  "bevy_gltf", "bevy_scene", "bevy_animation", "gltf_animation",
] }
# what differs between the PC build and the browser build (threads, X11, WebGL) is added per
# target in each game's Cargo.toml, so the one `cargo build` picks the right set
# rubevy stays a git dependency: it moves every day here, and the games are not to be pinned to
# whatever is on crates.io.
rubevy = { git = "https://github.com/sabiruby/rubevy" }
# The build-script half of the same repository (a second package beside rubevy): it walks a
# directory of `.rb` files and writes the table the browser build includes. It is a
# build-dependency and names nothing at all — a build script that named rubevy would build Bevy a
# second time for every game here — so it is kept beside rubevy rather than under it.
rubevy-build = { git = "https://github.com/sabiruby/rubevy" }
# The SabiRuby crates are named by version, exactly as rubevy names them, and `[patch.crates-io]`
# at the bottom of this file sends all of them to git. Writing it any other way puts two VMs in
# the binary — rubevy asks crates.io for `sabiruby`, so a git `sabiruby` here would be a second,
# different crate, and a `Value` of one is not a `Value` of the other. The patch is what keeps
# them one while the games still ride the VM's main branch.
sabiruby = "0.5.1"
# 0.2.3 is the floor here rather than rubevy's 0.2.2: the editor's colours call
# `sabiruby_compiler::highlight`, which 0.2.3 is the first to publish
# (sabiruby `docs/design/compiler.md`, "Publishing").
sabiruby-compiler = { version = "0.2.3", features = ["host"] }
# G3's save file: the `Vm` this converts values for is the one the scripts run in, which the
# patch below is what guarantees.
sabiruby-serde = "0.1.0"
# S4a: what was `rubevy-arena` until 2026-09-20, split in two. `rubevy-egui` is the part an
# outside rubevy user could want (the editor and the VM panel, over bevy_egui); `games-shell` is
# the shell the games here share, and it is the one that depends on the other.
rubevy-egui = { path = "crates/rubevy-egui" }
games-shell = { path = "crates/games-shell" }
# the in-game editor (the code panel); 0.42 is the one built for Bevy 0.19
bevy_egui = { version = "0.42", default-features = false, features = ["render", "default_fonts"] }

# One VM in the binary. rubevy is on crates.io now and asks for `sabiruby` by version, so every
# SabiRuby crate in this workspace — the ones named above and the ones rubevy pulls in — resolves
# to crates.io first; this sends them all to the same git checkout instead. Two things come out of
# it: the source is the same for rubevy's copy and ours (one `Vm` type, one set of `Value`s), and
# a fix in the VM reaches the games without waiting for a crates.io release, which is how they
# have always been built. It also keeps `github.com/sabiruby/sabiruby#<rev>` in `Cargo.lock`,
# which `.github/workflows/pages.yml` greps to build the Playground compiler from the same VM.
[patch.crates-io]
sabiruby = { git = "https://github.com/sabiruby/sabiruby" }
sabiruby-compiler = { git = "https://github.com/sabiruby/sabiruby" }
sabiruby-serde = { git = "https://github.com/sabiruby/sabiruby" }

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/sabiruby/rubevy_games"

[profile.dev]
opt-level = 1          # Bevy is unusable at 0

[profile.dev.package."*"]
opt-level = 3

# The browser build (`web/build.sh`): a release build that favours size, since the page downloads it.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
