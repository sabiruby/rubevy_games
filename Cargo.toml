[workspace]
resolver = "3"
members = ["crates/rubevy-arena", "sabibots"]

# One Bevy for the whole repository: a binary can only have one, and keeping the version in one
# place is what makes bumping it a single edit for every game here.
[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
  "bevy_asset", "bevy_log", "bevy_window", "bevy_winit", "bevy_core_pipeline",
  "bevy_render", "bevy_sprite", "bevy_text", "bevy_ui", "bevy_ui_render",
  "default_font", "png",
] }
# what differs between the PC build and the browser build (threads, X11, WebGL) is added per
# target in each game's Cargo.toml, so the one `cargo build` picks the right set
rubevy = { git = "https://github.com/sabiruby/rubevy" }
# the same source as rubevy's, so there is one VM in the binary and one set of types
sabiruby = { git = "https://github.com/sabiruby/sabiruby" }
sabiruby-compiler = { git = "https://github.com/sabiruby/sabiruby", features = ["host"] }
rubevy-arena = { path = "crates/rubevy-arena" }
# the in-game editor (the code panel); 0.42 is the one built for Bevy 0.19
bevy_egui = { version = "0.42", default-features = false, features = ["render", "default_fonts"] }

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/sabiruby/rubevy_games"

[profile.dev]
opt-level = 1          # Bevy is unusable at 0

[profile.dev.package."*"]
opt-level = 3

# The browser build (`web/build.sh`): a release build that favours size, since the page downloads it.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
