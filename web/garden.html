<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden</title>
<style>
  html, body { margin: 0; height: 100%; background: #12150f; color: #d8dcd2;
               font: 15px/1.5 system-ui, sans-serif; overflow: hidden; }
  #game { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
            padding: 0 16px; pointer-events: none; }
  #status[hidden] { display: none; }
  #status small { color: #8d9385; }
</style>
</head>
<body>
<div id="game"><canvas id="garden" tabindex="0"></canvas></div>
<div id="status"><div>Garden<br><small id="step">loading the Ruby compiler…</small></div></div>
<script type="module">
// Two modules: the game (Bevy + the SabiRuby VM, wasm32-unknown-unknown) and the Ruby compiler
// (the reference mruby compiler in C, the SabiRuby playground's wasm32-wasip1 module). The game
// calls window.gardenCompile(source) whenever it needs a creature's mind as bytecode — the name
// is the game's, because the two games are two pages and each defines its own (platform.rs).
import { Sabi, OK } from "./compiler/sabi.js";

const status = document.getElementById("status");
const step = document.getElementById("step");

// Keys the game uses and the browser would take. F5 is the one that matters: in the garden it
// saves the world, and in a browser it reloads the page — the exact opposite of what the player
// meant. The capture phase runs before anything else can see the event, so preventDefault here
// stops the browser and the game still gets the key. F9 no browser wants; F1 is Help; Tab moves
// the focus off the canvas; Ctrl+S is Save page and Ctrl+Enter belongs to the address bar.
// The HUD's Save and Load buttons do the same two things with no key at all, which is what a
// player who has not read this page will find.
addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  const own = ["F1", "F2", "F5", "F9", "Tab"].includes(e.key);
  if (own || (mod && (e.key === "s" || e.key === "Enter"))) e.preventDefault();
}, { capture: true });

try {
  const sabi = await Sabi.create(await fetch("./compiler/sabiruby.wasm"));
  window.gardenCompile = (source) => {
    if (sabi.compile(source, true) !== OK) throw sabi.text();
    return sabi.binary();
  };
  step.textContent = "loading the game…";
  const game = await import("./pkg/game.js");
  setTimeout(() => { status.hidden = true; document.getElementById("garden").focus(); }, 0);
  await game.default();
} catch (e) {
  // winit leaves its start-up by throwing on purpose; that one is not a failure
  if (!String(e).includes("Using exceptions for control flow")) {
    status.hidden = false;
    step.textContent = "could not start: " + e;
    console.error(e);
  }
}
</script>
</body>
</html>
