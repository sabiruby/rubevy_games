[package]
name = "sabibots"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SabiRuby Battle — robots whose brains are Ruby, running as tasks in one VM"

# `build.rs`: the `ruby/` directory put into the binary for the browser build. std and nothing
# else, and it is built for this machine rather than for the target.
[build-dependencies]
rubevy-build.workspace = true

[dependencies]
bevy.workspace = true
rubevy.workspace = true
sabiruby.workspace = true
# S4a: what was `rubevy-arena` until 2026-09-20. The panels are `rubevy-egui`'s, the arena
# camera, the HUD, the guide and the platform split are `games-shell`'s.
rubevy-egui.workspace = true
games-shell.workspace = true
bevy_egui.workspace = true
# S5b-2: the match hands its numbers over as a Ruby Hash and one line reads it —
# `from_value::<MatchModel>` walks it and says what is wrong with it in the script's own terms.
# The garden has had it since G3 for the same reason (`sabiruby` `docs/design/serde.md`): the
# message a badly shaped Hash gets back is worth as much as the reading. The crate names the VM
# by path, so pointing at the same source is what keeps one VM in the binary.
sabiruby-serde.workspace = true
serde = { version = "1", features = ["derive"] }

# The PC build: the Ruby compiler (C) is linked in, Bevy runs on threads and opens an X11 or
# Wayland window.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sabiruby-compiler.workspace = true
bevy = { workspace = true, features = ["multi_threaded", "x11"] }

# The browser build (`web/build.sh`): Bevy draws with WebGL2 into a canvas, and Ruby is compiled
# by a second wasm module (the playground's compiler) that the page loads beside the game.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["web", "webgl2"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Location"] }
