# The browser version of the games, on GitHub Pages: https://sabiruby.github.io/rubevy_games/
# One site, two games (G5): the entry page at the top, SabiRuby Battle at /sabibots/ and the
# garden at /garden/. Built by `web/build.sh all`, as locally. The Ruby compiler module comes from
# sabiruby-playground, built against the same SabiRuby commit as the games' VM (the one Cargo.lock
# names), and each game gets its own copy of it.
name: pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
env:
  # d72e000: sabi_highlight and Sabi#highlight, which the page's colour bridge calls (H2 of
  # docs/plans/editor-highlight-plan.md). Older than that and the published game is the only one
  # without colour, because window.gardenHighlight would not exist. The playground's own module
  # is built here against the SabiRuby commit below, which is Cargo.lock's — and `highlight()`
  # arrived in SabiRuby at 7be7b86, so the two have to move together.
  PLAYGROUND_REF: d72e0002812c0f674189f6429c7770230fd1a70c
  WASI_SDK: "34"
  BINARYEN: "132"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rubevy_games
      - name: the SabiRuby commit of Cargo.lock
        id: vm
        run: echo "ref=$(grep -m1 -o 'github.com/sabiruby/sabiruby#[0-9a-f]*' rubevy_games/Cargo.lock | cut -d'#' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: sabiruby/sabiruby-playground
          ref: ${{ env.PLAYGROUND_REF }}
          path: sabiruby-playground
      - uses: actions/checkout@v4
        with:
          repository: sabiruby/sabiruby
          ref: ${{ steps.vm.outputs.ref }}
          path: sabiruby
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rubevy_games
            sabiruby-playground/wasm
      - name: wasi-sdk, binaryen, wasm-bindgen
        run: |
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK}/wasi-sdk-${WASI_SDK}.0-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-${WASI_SDK}.0-x86_64-linux" >> "$GITHUB_ENV"
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN}/binaryen-version_${BINARYEN}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN}/bin" >> "$GITHUB_PATH"
          v=$(grep -A1 '^name = "wasm-bindgen"$' rubevy_games/Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-$v-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: the Ruby compiler module
        working-directory: sabiruby-playground
        run: tools/build.sh
      - name: web/build.sh all
        working-directory: rubevy_games
        run: web/build.sh all
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rubevy_games/web/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
