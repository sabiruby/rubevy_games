[package]
name = "garden"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Garden — a small 3D world whose creatures read and write their own ECS components from Ruby"

[dependencies]
bevy.workspace = true
rubevy.workspace = true
# The VM itself, for G2's `Genome`: `#[derive(RubyClass)]` and `#[ruby_methods]` turn a Rust
# struct into a Ruby class, and they arrive through the VM crate's `macros` feature rather than
# through a second dependency on `sabiruby-macros` (sabiruby `docs/design/macros.md`, "How a host
# depends on it" — serde's arrangement, one dependency and one `use`). The feature is off by
# default because a proc macro is a compiler plugin and the VM is built for targets that have no
# host toolchain in the picture; a game has one, so it asks for it. rubevy names the same source,
# so there is one VM in the binary either way.
sabiruby = { workspace = true, features = ["macros"] }

# The PC build: the Ruby compiler (C) is linked in, Bevy runs on threads and opens an X11 or
# Wayland window.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sabiruby-compiler.workspace = true
bevy = { workspace = true, features = ["multi_threaded", "x11"] }

# The browser build (G5): Bevy draws with WebGL2 into a canvas, and Ruby is compiled by a second
# wasm module (the playground's compiler) that the page loads beside the game.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["web", "webgl2"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Location"] }
