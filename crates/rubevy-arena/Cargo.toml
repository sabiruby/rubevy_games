[package]
name = "rubevy-arena"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The 2D floor the games in this repository stand on: a camera, sprites, a HUD, and reloading the Ruby that drives them"

[dependencies]
bevy.workspace = true
rubevy.workspace = true
sabiruby.workspace = true
bevy_egui.workspace = true

# watching the Ruby directory for edits: there is no directory to watch in a browser
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = "8"

# G6b: `navigator.language`, so the guide opens in the language the browser was asked for. The PC
# build reads `LANG` out of the environment, which needs nothing (`src/settings.rs`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Navigator"] }
