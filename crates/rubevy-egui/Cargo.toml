[package]
name = "rubevy-egui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "egui panels for a Bevy game whose Ruby is edited while it runs: an editor, a VM inspector, and the pixels they cover"

[dependencies]
bevy.workspace = true
bevy_egui.workspace = true
# the VM panel: `rubevy` for the scripts in the world, `sabiruby` for `Vm::snapshot`, which is
# what the frames, the registers and the heap are read out of.
rubevy.workspace = true
sabiruby.workspace = true

# watching the Ruby directory for edits (`Watch`): there is no directory to watch in a browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = "8"
