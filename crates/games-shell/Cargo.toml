[package]
name = "games-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The shell the games in this repository share: the platform split, the checks, the flags, the guide, the settings and the cameras"
# This one is for the games here and says so in its name; `rubevy-egui` beside it is the part an
# outside rubevy user would want. Nothing to publish.
publish = false

[dependencies]
bevy.workspace = true
bevy_egui.workspace = true
# S4a: `ViewInsets` — the pixels a panel covers, which both cameras here read. It belongs to the
# crate whose editor writes it. The dependency goes this way only.
rubevy-egui.workspace = true

# the Ruby compiler, which `platform::compile` and `platform::highlight` are on a PC —
# both games already had it as a dependency of their own for exactly those two functions, so
# naming it here moves the lines rather than adding anything to a build (S1).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sabiruby-compiler.workspace = true

# S3: `examples/camera.rs` opens a window of its own, which the games ask for in their own
# manifests (`bevy = { features = ["multi_threaded", "x11"] }`) and this crate — a library — does
# not. A dev-dependency asks for it for the example and for nothing that is built into a game.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bevy = { workspace = true, features = ["multi_threaded", "x11"] }

# G6b: `navigator.language`, so the guide opens in the language the browser was asked for. The PC
# build reads `LANG` out of the environment, which needs nothing (`src/settings.rs`).
# S1: and, with `platform` and `checks` here, the rest of what a page is asked — `Storage` for the
# saves and the scripts, `Location` for `?selftest`, and `js-sys` for the page's compiler bridge,
# which is looked up by name (`js_sys::Reflect`) rather than bound to one at compile time. Both
# games already ask for all of this; the versions are theirs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Navigator", "Storage", "Location"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
